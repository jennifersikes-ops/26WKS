function startMini(id, secs) {
  const info = MINI_INFO[id];
  screen(hud() + '<div class="card"><h2>' + info[0] + ' ' + info[1] + '</h2><div class="readout"><b id="mt">⏱ ' + secs + 's</b> · <b id="msc">Score: 0</b></div>' +
    '<canvas id="cv" class="cv" width="640" height="360" style="touch-action:none;cursor:crosshair" aria-label="' + info[1] + ' game"></canvas>' +
    '<p class="small">' + info[2] + '</p><div class="actions"><button class="btn" id="quit">End game</button></div></div>');
  const cv = $('#cv'), cx = cv.getContext ? cv.getContext('2d') : null;
  const game = {brick: miniBrick, hoops: miniHoops, reel: miniReel, snake: miniSnake, golf: miniGolf, soccer: miniSoccer, burger: miniBurger, smash: miniSmash, fit: miniFit, nails: miniNails}[id](cx);
  const inp = {x: null, y: null, act: false, l: 0, r: 0, u: 0, d: 0};
  const pos = e => { const b = cv.getBoundingClientRect(); inp.x = Math.max(0, Math.min(640, (e.clientX - b.left) / b.width * 640)); inp.y = Math.max(0, Math.min(360, (e.clientY - b.top) / b.height * 360)); };
  const pm = e => pos(e), pd = e => { pos(e); inp.act = true; e.preventDefault(); };
  const kd = e => { if (e.key === 'ArrowLeft') { inp.l = 1; inp.x = inp.y = null; e.preventDefault(); } else if (e.key === 'ArrowRight') { inp.r = 1; inp.x = inp.y = null; e.preventDefault(); } else if (e.key === 'ArrowUp') { inp.u = 1; inp.x = inp.y = null; e.preventDefault(); } else if (e.key === 'ArrowDown') { inp.d = 1; inp.x = inp.y = null; e.preventDefault(); } else if (e.key === ' ' || e.key === 'Spacebar') { inp.act = true; e.preventDefault(); } };
  const ku = e => { if (e.key === 'ArrowLeft') inp.l = 0; else if (e.key === 'ArrowRight') inp.r = 0; else if (e.key === 'ArrowUp') inp.u = 0; else if (e.key === 'ArrowDown') inp.d = 0; };
  cv.addEventListener('pointermove', pm); cv.addEventListener('pointerdown', pd);
  document.addEventListener('keydown', kd); document.addEventListener('keyup', ku);
  miniCleanup = () => { document.removeEventListener('keydown', kd); document.removeEventListener('keyup', ku); };
  let last = performance.now(), left = secs, over = false, endT = 0, done = false;
  function finish() { if (done) return; done = true; stopLab(); finishMini(id, game.score); }
  $('#quit').onclick = finish;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .04); last = now;
    if (!over) { left -= dt; game.update(dt, inp); inp.act = false; if (left <= 0) { left = 0; over = true; sfx('star'); } }
    else { endT += dt; if (endT > 1.3) { finish(); return; } }
    game.draw(over);
    $('#mt').textContent = '⏱ ' + Math.ceil(left) + 's'; $('#msc').textContent = 'Score: ' + game.score;
    labRAF = requestAnimationFrame(frame);
  }
  labRAF = requestAnimationFrame(frame);
}

function finishMini(id, score) {
  const best = (S.arcade.best[id] || 0) < score; if (best) S.arcade.best[id] = score;
  S.arcade.plays++; S.rw = null; if (S.arcade.plays >= 5) award('arcade'); save();
  sfx('star'); confetti(best && score > 0 ? 80 : 20);
  screen(hud() + '<div class="card hero pop"><div class="big">' + MINI_INFO[id][0] + '</div><h1>Time’s up!</h1><p style="font-size:1.6rem;margin:6px 0"><b>' + score + '</b> points</p>' +
    (best && score > 0 ? '<p><b>🏆 New personal best!</b></p>' : '<p class="sub">Personal best: ' + (S.arcade.best[id] || 0) + '</p>') +
    '<div class="row"><button class="btn primary" id="hub">Back to the map ▶</button></div></div>');
  $('#hub').onclick = showHub;
}

/* ===== Brick Lab ===== */
function miniBrick(cx) {
  const W = 640, H = 360, bw = 56, bh = 18, colors = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7'];
  const g = {score: 0, bricks: [], paddle: {x: 320, w: 96, h: 12, y: 332}, ball: {x: 320, y: 320, vx: 0, vy: 0, r: 7, stuck: true, st: 0}, flash: 0};
  function reset() { g.bricks = []; for (let r = 0; r < 5; r++) for (let c = 0; c < 10; c++) g.bricks.push({x: 20 + c * (bw + 4), y: 40 + r * (bh + 4), alive: true, col: colors[r]}); }
  reset();
  g.update = (dt, inp) => {
    const p = g.paddle, b = g.ball;
    if (inp.x !== null) p.x = inp.x; p.x += (inp.r - inp.l) * 460 * dt; p.x = Math.max(p.w / 2, Math.min(W - p.w / 2, p.x));
    if (b.stuck) {
      b.x = p.x; b.y = p.y - b.r - 1; b.st += dt;
      if (inp.act || b.st > .9) { const a = -Math.PI / 2 + (Math.random() - .5) * .8; b.vx = 330 * Math.cos(a); b.vy = 330 * Math.sin(a); b.stuck = false; b.st = 0; }
      return;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); sfx('pop'); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); sfx('pop'); }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); sfx('pop'); }
    if (b.y > H + 12) { b.stuck = true; b.st = 0; return; }
    if (b.vy > 0 && b.y + b.r >= p.y && b.y + b.r <= p.y + p.h + 8 && Math.abs(b.x - p.x) <= p.w / 2 + b.r) {
      const off = Math.max(-1, Math.min(1, (b.x - p.x) / (p.w / 2))), a = -Math.PI / 2 + off * 1.0 + (Math.random() - .5) * .25;
      b.vx = 340 * Math.cos(a); b.vy = 340 * Math.sin(a); b.y = p.y - b.r; sfx('pop');
    }
    for (const k of g.bricks) {
      if (!k.alive) continue;
      if (b.x + b.r > k.x && b.x - b.r < k.x + bw && b.y + b.r > k.y && b.y - b.r < k.y + bh) {
        k.alive = false; g.score += 10; sfx('hit');
        const dx = Math.min(b.x + b.r - k.x, k.x + bw - (b.x - b.r)), dy = Math.min(b.y + b.r - k.y, k.y + bh - (b.y - b.r));
        if (dx < dy) b.vx = -b.vx; else b.vy = -b.vy; break;
      }
    }
    if (g.bricks.every(k => !k.alive)) { g.score += 50; reset(); g.flash = 1; b.stuck = true; b.st = 0; }
  };
  g.draw = over => {
    if (!cx) return;
    cx.fillStyle = '#12224a'; cx.fillRect(0, 0, W, H);
    for (const k of g.bricks) if (k.alive) { cx.fillStyle = k.col; cx.fillRect(k.x, k.y, bw, bh); cx.fillStyle = 'rgba(255,255,255,.25)'; cx.fillRect(k.x, k.y, bw, 4); }
    const p = g.paddle, b = g.ball;
    cx.fillStyle = '#e9ecef'; cx.fillRect(p.x - p.w / 2, p.y, p.w, p.h); cx.fillStyle = '#4dabf7'; cx.fillRect(p.x - p.w / 2, p.y, p.w, 4);
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(b.x, b.y, b.r, 0, 7); cx.fill();
    if (b.stuck) { cx.fillStyle = '#fff'; cx.font = '700 14px system-ui,Arial,sans-serif'; cx.textAlign = 'center'; cx.fillText('Click or press Space to launch', W / 2, 250); }
    if (over) { cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(0, 0, W, H); cx.fillStyle = '#fff'; cx.font = '800 40px system-ui,Arial,sans-serif'; cx.textAlign = 'center'; cx.fillText('Time!', W / 2, H / 2); }
  };
  return g;
}

/* ===== Lab Hoops ===== */
function miniHoops(cx) {
  const W = 640, H = 360, Y0 = 318, G = 2400, V = Math.sqrt(2 * G * 282), RIM = 110, HALF = 36;
  const TD = (V + Math.sqrt(V * V - 4 * (G / 2) * (Y0 - RIM))) / G; // time when the ball is coming down through the rim
  const g = {score: 0, tt: 0, px: 320, shot: null, pops: [], TD: TD, hoopX: () => 320 + Math.sin(g.tt) * 200};
  g.update = (dt, inp) => {
    g.tt += dt * (1.3 + g.score * .03);
    if (inp.x !== null) g.px = inp.x; g.px += (inp.r - inp.l) * 400 * dt; g.px = Math.max(30, Math.min(W - 30, g.px));
    if (!g.shot && inp.act) g.shot = {t: 0, x: g.px, scored: false, judged: false};
    if (g.shot) {
      const s = g.shot; s.t += dt;
      if (!s.judged && s.t >= TD) {
        s.judged = true; const dx = Math.abs(s.x - g.hoopX());
        if (dx <= HALF - 6) { const pts = dx < 12 ? 3 : 2; g.score += pts; s.scored = true; g.pops.push({t: 0, x: g.hoopX(), text: '+' + pts + (pts === 3 ? ' Swish!' : '')}); sfx('ok'); }
        else { g.pops.push({t: 0, x: s.x, text: dx < HALF + 14 ? 'Rim out!' : 'Miss'}); sfx('bad'); }
      }
      if (s.t > TD + .5) g.shot = null;
    }
    g.pops.forEach(p => p.t += dt); g.pops = g.pops.filter(p => p.t < 1);
  };
  g.draw = over => {
    if (!cx) return;
    cx.fillStyle = '#1b2437'; cx.fillRect(0, 0, W, H); cx.fillStyle = '#c98f5a'; cx.fillRect(0, 300, W, 60);
    cx.strokeStyle = 'rgba(255,255,255,.35)'; cx.lineWidth = 3; cx.beginPath(); cx.arc(W / 2, 360, 90, Math.PI, 0); cx.stroke();
    const hx = g.hoopX();
    cx.fillStyle = '#f8f9fa'; cx.fillRect(hx - 46, 52, 92, 54); cx.strokeStyle = '#e03131'; cx.lineWidth = 3; cx.strokeRect(hx - 18, 76, 36, 28);
    cx.strokeStyle = 'rgba(255,255,255,.8)'; cx.lineWidth = 2;
    for (let i = 0; i <= 4; i++) { cx.beginPath(); cx.moveTo(hx - HALF + i * (HALF * 2 / 4), RIM); cx.lineTo(hx - 20 + i * 10, RIM + 42); cx.stroke(); }
    for (let j = 1; j <= 2; j++) { cx.beginPath(); cx.moveTo(hx - HALF + j * 8, RIM + j * 14); cx.lineTo(hx + HALF - j * 8, RIM + j * 14); cx.stroke(); }
    cx.strokeStyle = '#ff922b'; cx.lineWidth = 6; cx.beginPath(); cx.moveTo(hx - HALF, RIM); cx.lineTo(hx + HALF, RIM); cx.stroke();
    cx.strokeStyle = 'rgba(255,255,255,.25)'; cx.setLineDash([6, 8]); cx.lineWidth = 2; cx.beginPath(); cx.moveTo(g.px, Y0 - 16); cx.lineTo(g.px, 60); cx.stroke(); cx.setLineDash([]);
    let by = Y0, bxx = g.px;
    if (g.shot) { bxx = g.shot.x; by = Y0 - V * g.shot.t + .5 * G * g.shot.t * g.shot.t; }
    cx.fillStyle = '#ff922b'; cx.beginPath(); cx.arc(bxx, by, 14, 0, 7); cx.fill(); cx.strokeStyle = '#7f3b00'; cx.lineWidth = 2; cx.beginPath(); cx.arc(bxx, by, 14, 0, 7); cx.moveTo(bxx - 14, by); cx.lineTo(bxx + 14, by); cx.stroke();
    cx.font = '34px system-ui,Arial,sans-serif'; cx.textAlign = 'center'; cx.fillStyle = '#fff'; cx.fillText('🧑‍🔬', g.px, 352);
    g.pops.forEach(p => { cx.globalAlpha = 1 - p.t; cx.fillStyle = '#ffd43b'; cx.font = '800 22px system-ui,Arial,sans-serif'; cx.fillText(p.text, p.x, 90 - p.t * 30); cx.globalAlpha = 1; });
    if (over) { cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(0, 0, W, H); cx.fillStyle = '#fff'; cx.font = '800 40px system-ui,Arial,sans-serif'; cx.fillText('Time!', W / 2, H / 2); }
  };
  return g;
}

/* ===== Reel Lab ===== */
function miniReel(cx) {
  const W = 640, H = 360, TYPES = [['🐟', 10, 6], ['🐠', 20, 4], ['🐡', 30, 3], ['🦑', 50, 2], ['👢', -10, 2]];
  const pickType = () => { let r = Math.random() * 17; for (const t of TYPES) { r -= t[2]; if (r <= 0) return t; } return TYPES[0]; };
  const g = {score: 0, boat: 320, hook: {x: 320, y: 78, st: 'idle', fish: null}, fish: [], pops: []};
  function spawn(f, fresh) {
    const t = pickType(), dir = Math.random() < .5 ? 1 : -1;
    f.t = t; f.vx = dir * (55 + Math.random() * 85) * (1 + (4 - t[2]) * .05); f.y = 130 + Math.random() * 200;
    f.x = fresh ? Math.random() * W : (dir > 0 ? -40 : W + 40); f.caught = false;
  }
  for (let i = 0; i < 9; i++) { const f = {}; spawn(f, true); g.fish.push(f); }
  g.update = (dt, inp) => {
    if (inp.x !== null) g.boat = inp.x; g.boat += (inp.r - inp.l) * 380 * dt; g.boat = Math.max(30, Math.min(W - 30, g.boat));
    const h = g.hook;
    g.fish.forEach(f => { if (f.caught) return; f.x += f.vx * dt; if (f.x < -60 || f.x > W + 60) spawn(f, false); });
    if (h.st === 'idle') { h.x = g.boat; h.y = 78; if (inp.act) { h.st = 'down'; sfx('click'); } }
    else if (h.st === 'down') {
      h.y += 280 * dt;
      for (const f of g.fish) if (!f.caught && Math.hypot(f.x - h.x, f.y - h.y) < 26) { f.caught = true; h.fish = f; h.st = 'up'; sfx('pop'); break; }
      if (h.y > 345) h.st = 'up';
    } else if (h.st === 'up') {
      h.y -= 320 * dt; if (h.fish) { h.fish.x = h.x; h.fish.y = h.y + 6; }
      if (h.y <= 78) {
        h.y = 78; h.st = 'idle';
        if (h.fish) { const v = h.fish.t[1]; g.score = Math.max(0, g.score + v); g.pops.push({t: 0, x: h.x, text: (v > 0 ? '+' : '') + v}); sfx(v > 0 ? 'ok' : 'bad'); spawn(h.fish, false); h.fish = null; }
      }
    }
    g.pops.forEach(p => p.t += dt); g.pops = g.pops.filter(p => p.t < 1);
  };
  g.draw = over => {
    if (!cx) return;
    const sky = cx.createLinearGradient(0, 0, 0, 80); sky.addColorStop(0, '#a5d8ff'); sky.addColorStop(1, '#e7f5ff'); cx.fillStyle = sky; cx.fillRect(0, 0, W, 80);
    const sea = cx.createLinearGradient(0, 80, 0, H); sea.addColorStop(0, '#4dabf7'); sea.addColorStop(1, '#0b3d66'); cx.fillStyle = sea; cx.fillRect(0, 80, W, H - 80);
    cx.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 16; i++) cx.fillRect(i * 44 + (Date.now() / 60 % 44), 80, 22, 3);
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    g.fish.forEach(f => { if (f === g.hook.fish) return; cx.save(); cx.translate(f.x, f.y); if (f.vx > 0) cx.scale(-1, 1); cx.font = '32px system-ui,Arial,sans-serif'; cx.fillText(f.t[0], 0, 0); cx.restore(); });
    const h = g.hook;
    cx.strokeStyle = '#f1f3f5'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(g.boat, 52); cx.lineTo(h.x, h.y); cx.stroke();
    cx.strokeStyle = '#ced4da'; cx.lineWidth = 3; cx.beginPath(); cx.arc(h.x, h.y + 6, 7, 0, Math.PI * 1.2); cx.stroke();
    if (h.fish) { cx.save(); cx.translate(h.fish.x, h.fish.y + 10); cx.font = '32px system-ui,Arial,sans-serif'; cx.fillText(h.fish.t[0], 0, 0); cx.restore(); }
    cx.font = '40px system-ui,Arial,sans-serif'; cx.fillText('⛵', g.boat, 50);
    cx.textBaseline = 'alphabetic';
    g.pops.forEach(p => { cx.globalAlpha = 1 - p.t; cx.fillStyle = p.text[0] === '-' ? '#ff8787' : '#ffd43b'; cx.font = '800 22px system-ui,Arial,sans-serif'; cx.fillText(p.text, p.x, 120 - p.t * 30); cx.globalAlpha = 1; });
    if (over) { cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(0, 0, W, H); cx.fillStyle = '#fff'; cx.font = '800 40px system-ui,Arial,sans-serif'; cx.fillText('Time!', W / 2, H / 2); }
  };
  return g;
}

/* ===== shared mini-game helpers ===== */
const mClamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mEmo(cx, s, x, y, size) { cx.font = size + 'px system-ui,Arial,sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillStyle = '#000'; cx.fillText(s, x, y); cx.textBaseline = 'alphabetic'; }
function mTxt(cx, s, x, y, size, col, al) { cx.font = '800 ' + size + 'px system-ui,Arial,sans-serif'; cx.textAlign = al || 'center'; cx.fillStyle = col || '#fff'; cx.fillText(s, x, y); }
function mOver(cx, over) { if (!over) return; cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(0, 0, 640, 360); mTxt(cx, 'Time!', 320, 190, 40); }
function mPopAdd(g, x, y, text) { g.pops.push({t: 0, x: x, y: y, text: text}); }
function mPopStep(g, dt) { g.pops.forEach(p => p.t += dt); g.pops = g.pops.filter(p => p.t < 1); }
function mPopDraw(cx, g) { g.pops.forEach(p => { cx.globalAlpha = Math.max(0, 1 - p.t); mTxt(cx, p.text, p.x, p.y - p.t * 30, 22, '#ffd43b'); cx.globalAlpha = 1; }); }
function mEdge(g, inp) {
  const p = g.prev || (g.prev = {l: 0, r: 0, u: 0, d: 0});
  const e = {l: inp.l && !p.l, r: inp.r && !p.r, u: inp.u && !p.u, d: inp.d && !p.d};
  p.l = inp.l; p.r = inp.r; p.u = inp.u; p.d = inp.d; return e;
}
/* pick one of n equal columns: mouse/touch = column under the pointer, keyboard = ← → then Space */
function mPick(g, inp, n) {
  const e = mEdge(g, inp);
  if (g.sel === undefined) g.sel = 0;
  if (inp.x !== null) g.sel = mClamp(Math.floor(inp.x / (640 / n)), 0, n - 1);
  else { if (e.l) g.sel = (g.sel + n - 1) % n; if (e.r) g.sel = (g.sel + 1) % n; }
  return inp.act ? g.sel : -1;
}

/* ===== Snake Lab ===== */
function miniSnake(cx) {
  const W = 640, H = 360, C = 20, NX = 32, NY = 18, FOODS = ['🧪', '🔬', '🧬', '⚗️', '🧫'];
  const g = {score: 0, pops: [], acc: 0, dir: [1, 0], nd: [1, 0], snake: [], food: [0, 0], fe: FOODS[0]};
  function place() { for (let k = 0; k < 300; k++) { const f = [Math.floor(Math.random() * NX), Math.floor(Math.random() * NY)]; if (!g.snake.some(s => s[0] === f[0] && s[1] === f[1])) return f; } return [0, 0]; }
  function reset() { g.snake = [[8, 9], [7, 9], [6, 9]]; g.dir = [1, 0]; g.nd = [1, 0]; g.food = place(); }
  reset();
  g.update = (dt, inp) => {
    mPopStep(g, dt);
    let want = null;
    if (inp.l) want = [-1, 0]; else if (inp.r) want = [1, 0]; else if (inp.u) want = [0, -1]; else if (inp.d) want = [0, 1];
    else if (inp.x !== null && inp.y !== null) {
      const h = g.snake[0], dx = inp.x - (h[0] * C + C / 2), dy = inp.y - (h[1] * C + C / 2);
      if (Math.abs(dx) > 12 || Math.abs(dy) > 12) want = Math.abs(dx) > Math.abs(dy) ? [dx > 0 ? 1 : -1, 0] : [0, dy > 0 ? 1 : -1];
    }
    if (want && !(want[0] === -g.dir[0] && want[1] === -g.dir[1])) g.nd = want;
    g.acc += dt;
    const step = Math.max(.07, .12 - g.score * .0003);
    while (g.acc >= step) {
      g.acc -= step; g.dir = g.nd;
      const h = g.snake[0], n = [(h[0] + g.dir[0] + NX) % NX, (h[1] + g.dir[1] + NY) % NY];
      if (g.snake.slice(0, -1).some(s => s[0] === n[0] && s[1] === n[1])) { mPopAdd(g, n[0] * C, n[1] * C, 'Ouch!'); sfx('bad'); reset(); break; }
      g.snake.unshift(n);
      if (n[0] === g.food[0] && n[1] === g.food[1]) { g.score += 10; mPopAdd(g, n[0] * C, n[1] * C, '+10'); sfx('hit'); g.fe = FOODS[Math.floor(Math.random() * FOODS.length)]; g.food = place(); }
      else g.snake.pop();
    }
  };
  g.draw = over => {
    if (!cx) return;
    cx.fillStyle = '#0b2e1f'; cx.fillRect(0, 0, W, H);
    cx.fillStyle = 'rgba(255,255,255,.05)';
    for (let x = 0; x < NX; x++) for (let y = 0; y < NY; y++) if ((x + y) % 2 === 0) cx.fillRect(x * C, y * C, C, C);
    mEmo(cx, g.fe, g.food[0] * C + C / 2, g.food[1] * C + C / 2, 20);
    g.snake.forEach((s, i) => { cx.fillStyle = i === 0 ? '#b2f2bb' : (i % 2 ? '#51cf66' : '#40c057'); cx.fillRect(s[0] * C + 1, s[1] * C + 1, C - 2, C - 2); });
    const h = g.snake[0]; cx.fillStyle = '#212529';
    cx.beginPath(); cx.arc(h[0] * C + 6, h[1] * C + 8, 2.5, 0, 7); cx.arc(h[0] * C + 14, h[1] * C + 8, 2.5, 0, 7); cx.fill();
    mPopDraw(cx, g); mOver(cx, over);
  };
  return g;
}

/* ===== Mini Golf ===== */
function miniGolf(cx) {
  const W = 640, H = 360, R = 8, HR = 15, PTS = [40, 25, 15, 10, 5];
  const LV = [
    {tee: [70, 180], hole: [570, 180], walls: [[300, 90, 24, 180]]},
    {tee: [70, 310], hole: [570, 50], walls: [[220, 110, 200, 22], [220, 230, 200, 22]]},

    if (g.phase === 'cheer') { if (g.t >= .8) newClient(); return; }
    if (pick < 0) return;
    if (pick === g.design[g.k]) {
      g.painted.push(pick); g.k++; g.score += 5; sfx('hit');
      if (g.k >= g.L) { g.score += 15; g.done++; g.phase = 'cheer'; g.t = 0; mPopAdd(g, 320, 70, 'Perfect set! +20'); sfx('ok'); }
    } else { mPopAdd(g, 320, 70, 'Oops! Look again'); sfx('bad'); g.phase = 'show'; g.t = 0; g.k = 0; g.painted = []; }
  };
  g.draw = over => {
    if (!cx) return;
    cx.fillStyle = '#4a1942'; cx.fillRect(0, 0, W, H);
    const msg = g.phase === 'show' ? 'Memorize the colors!' : g.phase === 'cheer' ? 'Beautiful! Next client…' : 'Paint nail ' + (g.k + 1) + ' of ' + g.L;
    mTxt(cx, msg, W / 2, 34, 24);
    const xs = []; for (let i = 0; i < g.L; i++) xs.push(320 + (i - (g.L - 1) / 2) * 84);
    cx.fillStyle = '#f1c6a4'; cx.fillRect(xs[0] - 40, 190, xs[g.L - 1] - xs[0] + 80, 62);
    xs.forEach((x, i) => {
      cx.fillStyle = '#f1c6a4'; cx.fillRect(x - 28, 120, 56, 90); cx.beginPath(); cx.arc(x, 120, 28, 0, 7); cx.fill();
      let col = '#f8d7e0';
      if (g.phase === 'show') col = COLS[g.design[i]][1]; else if (g.phase === 'cheer') col = COLS[g.design[i]][1]; else if (i < g.painted.length) col = COLS[g.painted[i]][1];
      cx.fillStyle = col; cx.beginPath(); cx.ellipse(x, 118, 20, 26, 0, 0, 7); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.4)'; cx.beginPath(); cx.ellipse(x - 6, 108, 4, 9, 0, 0, 7); cx.fill();
      if (g.phase === 'paint' && i === g.k) { cx.strokeStyle = '#fff'; cx.lineWidth = 3; cx.setLineDash([5, 4]); cx.beginPath(); cx.ellipse(x, 118, 25, 32, 0, 0, 7); cx.stroke(); cx.setLineDash([]); }
    });
    COLS.forEach((c, i) => {
      const x = 64 + i * 128;
      if (g.sel === i) { cx.strokeStyle = '#fff'; cx.lineWidth = 3; cx.strokeRect(i * 128 + 10, 246, 108, 108); }
      cx.fillStyle = '#212529'; cx.fillRect(x - 12, 254, 24, 16); cx.fillStyle = c[1]; cx.fillRect(x - 10, 270, 20, 14); cx.fillRect(x - 22, 284, 44, 46);
      cx.fillStyle = 'rgba(255,255,255,.35)'; cx.fillRect(x - 17, 288, 6, 36);
      mTxt(cx, c[0], x, 348, 14);
    });
    mPopDraw(cx, g); mOver(cx, over);
  };
  return g;
}
